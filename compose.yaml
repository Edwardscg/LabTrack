name: labtrack
services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_ADMIN_PASSWORD:?Configura SQL_ADMIN_PASSWORD en .env}
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  init:
    image: labtrack-web:local
    build: .
    command: ["--initialize"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=LabTrackDb;User ID=sa;Password=${SQL_ADMIN_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      RuntimeDbPassword: ${SQL_APP_PASSWORD:?Configura SQL_APP_PASSWORD en .env}
      Seed__EncargadoPassword: ${SEED_ENCARGADO_PASSWORD:-}
      Seed__Estudiante1Password: ${SEED_ESTUDIANTE1_PASSWORD:-}
      Seed__Estudiante2Password: ${SEED_ESTUDIANTE2_PASSWORD:-}

  web:
    image: labtrack-web:local
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=LabTrackDb;User ID=labtrack_web;Password=${SQL_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "127.0.0.1:${LABTRACK_PORT:-5133}:8080"
    volumes:
      - session-keys:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  sql-data:
  session-keys:
