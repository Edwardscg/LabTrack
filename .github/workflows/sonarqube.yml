name: Análisis SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validar configuración
        run: |
          foreach ($key in 'SONAR_TOKEN') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
              throw "Falta configurar $key en GitHub."
            }
          }
      - name: Preparar scanner y dependencias
        run: |
          $scannerPath = Join-Path $env:RUNNER_TEMP "labtrack-sonar-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          dotnet tool install dotnet-sonarscanner --tool-path $scannerPath --version 12.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scannerPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          dotnet restore LabTrack.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Iniciar análisis
        run: |
          dotnet-sonarscanner begin /k:"Edwardscg_LabTrack" /o:"edwardscg" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.exclusions="**/wwwroot/lib/**" /d:sonar.scanner.scanAll=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compilar solución
        run: dotnet build LabTrack.sln --configuration Release --no-restore --no-incremental
      - name: Finalizar análisis
        run: |
          dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
